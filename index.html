<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Словотренер">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>Словотренер</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#151821;--muted:#697386;--line:#e5e7eb;--dark:#111827;--good:#067647;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:780px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}.head h1{margin:0;font-size:34px;letter-spacing:-1.5px}.sub{color:var(--muted);font-size:14px}.streak{background:white;border:1px solid var(--line);padding:9px 12px;border-radius:999px;white-space:nowrap}.tabs{display:flex;gap:7px;overflow:auto;margin:18px 0}.tab{border:0;background:transparent;color:var(--muted);padding:10px 13px;border-radius:13px;font-weight:700}.tab.on{background:var(--dark);color:#fff}.view{display:none}.view.on{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 10px 30px rgba(17,24,39,.05)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:white;border:1px solid var(--line);border-radius:18px;padding:16px}.n{font-size:30px;font-weight:900}.lab{font-size:13px;color:var(--muted)}h2{margin:0 0 14px;font-size:21px}label{font-size:12px;font-weight:800;color:#374151;display:block;margin:10px 0 6px}input,select{width:100%;border:1px solid #d1d5db;border-radius:14px;padding:13px 14px;font:inherit;background:white;outline:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:14px;padding:12px 15px;background:var(--dark);color:#fff;font-weight:800}.btn.alt{background:#f3f4f6;color:var(--dark)}.btn.good{background:var(--good)}.btn.bad{background:var(--bad)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.wordrow{padding:13px 0;border-bottom:1px solid var(--line)}.wordrow:last-child{border:0}.word{font-weight:900;font-size:17px}.translation{margin-top:3px}.meta{font-size:12px;color:var(--muted);margin-top:5px}.search{margin-bottom:12px}.qbox{text-align:center;min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center}.qtype{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:1px}.qword{font-size:clamp(36px,10vw,62px);font-weight:950;letter-spacing:-2px;margin:16px 0}.qhint{color:var(--muted)}.answer{width:100%;margin-top:20px}.answer input{text-align:center;font-size:19px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.choice{border:1px solid var(--line);background:#fff;border-radius:15px;padding:14px;font-weight:750;text-align:left}.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:10px 0 14px}.progress div{height:100%;background:var(--dark)}.notice{padding:13px;background:#fffbeb;border:1px solid #fde68a;border-radius:14px;color:#92400e;font-size:13px}.hide{display:none!important}.center{text-align:center}.bigscore{font-size:52px;font-weight:950}.danger{color:var(--bad);background:none;border:0;padding:0;font-weight:800}.small{font-size:12px;color:var(--muted)}
@media(max-width:560px){.row,.choices{grid-template-columns:1fr}.head{align-items:flex-start}.head h1{font-size:30px}}
</style>
</head>
<body>
<div class="app">
<div class="head"><div><h1>Словотренер</h1><div class="sub">Твои слова. Твой прогресс. Общие обновления.</div></div><div class="streak">🔥 <b id="streak">0</b> дн.</div></div>
<div class="tabs"><button class="tab on" data-v="home">Главная</button><button class="tab" data-v="words">Слова</button><button class="tab" data-v="train">Тренировка</button><button class="tab" data-v="data">Данные</button></div>

<section id="home" class="view on">
<div class="stats"><div class="stat"><div class="n" id="sWords">0</div><div class="lab">слов</div></div><div class="stat"><div class="n" id="sDue">0</div><div class="lab">к повторению</div></div><div class="stat"><div class="n" id="sAcc">0%</div><div class="lab">точность</div></div><div class="stat"><div class="n" id="sSessions">0</div><div class="lab">тренировок</div></div></div>
<div class="card" style="margin-top:14px"><h2>Добавить своё слово</h2><div class="row"><div><label>Слово / фраза</label><input id="newWord" placeholder="например: achieve"></div><div><label>Перевод</label><input id="newTr" placeholder="достигать"></div></div><div class="row"><div><label>Категория</label><input id="newCat" placeholder="мои слова"></div><div><label>Пример</label><input id="newEx" placeholder="необязательно"></div></div><div class="actions"><button class="btn" id="addBtn">Добавить</button><button class="btn alt" id="quickBtn">Тренировка 10</button></div></div>
<div class="card"><h2>Сегодня</h2><div id="today" class="sub">Пока тренировок не было.</div></div>
</section>

<section id="words" class="view"><div class="card"><h2>Мои слова</h2><input class="search" id="search" placeholder="Поиск…"><div id="list"></div></div></section>

<section id="train" class="view">
<div id="setup" class="card"><h2>Тренировка</h2><div id="warn"></div><div class="row"><div><label>Заданий</label><select id="count"><option>10</option><option>20</option><option>30</option><option value="all">Все слова</option></select></div><div><label>Категория</label><select id="category"><option value="">Все категории</option></select></div></div><div class="actions"><button class="btn" id="startBtn">Начать</button></div></div>
<div id="session" class="hide"><div class="small"><b id="counter"></b> · <span id="live"></span></div><div class="progress"><div id="bar"></div></div><div class="card qbox"><div class="qtype" id="qtype"></div><div class="qword" id="qword"></div><div class="qhint" id="qhint"></div><button class="btn alt" id="speak" style="margin-top:12px">🔊 Произнести</button><div class="answer" id="answer"></div></div></div>
<div id="result" class="card center hide"><div style="font-size:58px">🎯</div><h2>Готово</h2><div class="bigscore" id="score"></div><div class="sub" id="scoreText"></div><div class="actions" style="justify-content:center"><button class="btn" id="again">Ещё одну</button><button class="btn alt" id="homeBtn">На главную</button></div></div>
</section>

<section id="data" class="view"><div class="card"><h2>Резервная копия</h2><div class="sub">Личный прогресс хранится на этом устройстве.</div><div class="actions"><button class="btn" id="exportBtn">Экспорт JSON</button><label class="btn alt">Импорт JSON<input id="importFile" type="file" accept="application/json,.json" hidden></label></div></div><div class="card"><h2>Сброс</h2><button class="btn bad" id="resetBtn">Удалить личные данные</button></div></section>
</div>
<script>
const SHARED=[
['seed_1','advisability','целесообразность'],['seed_2','participate','участвовать'],['seed_3','spacecraft / space vehicle','космический аппарат'],['seed_4','requirements','требования'],['seed_5','necessities','предметы первой необходимости'],['seed_6','guaranteed','гарантированный'],['seed_7','bulky','громоздкий'],['seed_8','entrusted','порученный, доверенный'],['seed_9','unmanned','беспилотный'],['seed_10','probes','зонды'],['seed_11','malfunction','неисправность'],['seed_12','weightlessness','невесомость'],['seed_13','encounter','сталкиваться с'],['seed_14','precious','ценный'],['seed_15','lacking','отсутствующий'],['seed_16','specifically','специально'],['seed_17','deep space','дальний космос'],['seed_18','reasoning','рассуждение, логическое мышление'],['seed_19','fulfilled','выполненный, осуществлённый'],['seed_20','simulate','имитировать'],['seed_21','substitution','замена'],['seed_22','revise','пересматривать'],['seed_23','collaborative','совместный'],['seed_24','apparent','очевидный, заметный'],['seed_25','compromise','подвергать риску, ставить под угрозу'],['seed_26','evolve','развиваться'],['seed_27','outpost','аванпост, удалённая база'],['seed_28','infrastructure','инфраструктура'],['seed_29','vicinity','окрестность, близость'],['seed_30','enterprises','предприятия'],['seed_31','essential','необходимый'],['seed_32','voyage','путешествовать'],['seed_33','frontier','граница, новый рубеж'],['seed_34','colonisation','колонизация, заселение'],['seed_35','consciousness','осознание, сознание'],['seed_36','fragility','хрупкость'],['seed_37','preserve','сохранять']
].map(x=>({id:x[0],word:x[1],translation:x[2],category:'Space English',example:'',shared:true,level:0,correct:0,wrong:0,seen:0,nextReview:0}));
const KEY='slovotrener_live_v1';
const empty=()=>({words:[],stats:{sessions:0,correct:0,total:0,streak:0,lastDate:null,daily:{}}});
function norm(s){return String(s||'').trim().toLowerCase().replace(/[.,!?;:"'`]/g,'').replace(/\s+/g,' ')}
function load(){let st;try{st=JSON.parse(localStorage.getItem(KEY))||empty()}catch{st=empty()}st.words ||= [];st.stats ||= empty().stats;st.stats.daily ||= {};for(const sw of SHARED){let w=st.words.find(x=>x.id===sw.id||norm(x.word)===norm(sw.word));if(w){w.id=sw.id;w.word=sw.word;w.translation=sw.translation;w.category=sw.category;w.shared=true}else st.words.push(structuredClone(sw))}return st}
let state=load(),sess=null;
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function today(){return new Date().toISOString().slice(0,10)}
function due(w){return !w.nextReview||w.nextReview<=Date.now()}
function goto(id){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===id));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.v===id));scrollTo(0,0)}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>goto(b.dataset.v));
function render(){sWords.textContent=state.words.length;sDue.textContent=state.words.filter(due).length;sAcc.textContent=(state.stats.total?Math.round(state.stats.correct/state.stats.total*100):0)+'%';sSessions.textContent=state.stats.sessions;streak.textContent=state.stats.streak||0;let d=state.stats.daily[today()];todayEl=document.getElementById('today');todayEl.textContent=d?`${d.sessions} тренировок · ${d.total} заданий · ${Math.round(d.correct/Math.max(1,d.total)*100)}% верно`:'Пока тренировок не было.';renderList();renderCats();warn.innerHTML=state.words.length<4?'<div class="notice">Добавь минимум 4 слова для разнообразной тренировки.</div>':''}
function renderList(){let q=norm(search.value),arr=state.words.filter(w=>!q||norm(w.word+' '+w.translation+' '+w.category).includes(q));list.innerHTML=arr.length?arr.map(w=>`<div class="wordrow"><div class="word">${esc(w.word)}</div><div class="translation">${esc(w.translation)}</div><div class="meta">${esc(w.category||'Без категории')} · ✓ ${w.correct||0} · ✕ ${w.wrong||0}${w.shared?' · общий':''}</div>${w.shared?'':`<button class="danger" data-del="${w.id}">Удалить</button>`}</div>`).join(''):'<div class="sub">Ничего не найдено.</div>';list.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{state.words=state.words.filter(w=>w.id!==b.dataset.del);save()})}
search.oninput=renderList;
function renderCats(){let cur=category.value,c=[...new Set(state.words.map(w=>w.category).filter(Boolean))].sort();category.innerHTML='<option value="">Все категории</option>'+c.map(x=>`<option>${esc(x)}</option>`).join('');if(c.includes(cur))category.value=cur}
addBtn.onclick=()=>{let word=newWord.value.trim(),translation=newTr.value.trim();if(!word||!translation)return alert('Заполни слово и перевод');if(state.words.some(w=>norm(w.word)===norm(word)))return alert('Такое слово уже есть');state.words.unshift({id:'user_'+Date.now(),word,translation,category:newCat.value.trim()||'Мои слова',example:newEx.value.trim(),shared:false,level:0,correct:0,wrong:0,seen:0,nextReview:0});newWord.value=newTr.value=newEx.value='';save()};
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(n){let pool=state.words.filter(w=>!category.value||w.category===category.value);if(!pool.length)return alert('Нет слов для тренировки');let total=n==='all'?pool.length:Number(n),qs=[];for(let i=0;i<total;i++){let w=pool[Math.floor(Math.random()*pool.length)],m=['toTr','toWord','choice','flash'][Math.floor(Math.random()*4)];qs.push({id:w.id,m})}sess={qs,i:0,correct:0,total:0};setup.classList.add('hide');result.classList.add('hide');session.classList.remove('hide');showQ()}
startBtn.onclick=()=>start(count.value);quickBtn.onclick=()=>{goto('train');start('10')};
function cw(){return state.words.find(w=>w.id===sess.qs[sess.i].id)}
function showQ(){if(sess.i>=sess.qs.length)return finish();let q=sess.qs[sess.i],w=cw();counter.textContent=`${sess.i+1} / ${sess.qs.length}`;live.textContent=`верно ${sess.correct}`;bar.style.width=(sess.i/sess.qs.length*100)+'%';qhint.textContent=w.category||'';speak.classList.toggle('hide',q.m==='toWord');answer.innerHTML='';if(q.m==='toTr'){qtype.textContent='Переведи слово';qword.textContent=w.word;typed(w.translation)}else if(q.m==='toWord'){qtype.textContent='Напиши слово';qword.textContent=w.translation;typed(w.word)}else if(q.m==='choice'){qtype.textContent='Выбери перевод';qword.textContent=w.word;choiceQ(w)}else{qtype.textContent='Карточка';qword.textContent=w.word;flashQ(w)}}
function typed(correct){answer.innerHTML='<input id="ans" placeholder="Введи ответ…"><div class="actions" style="justify-content:center"><button class="btn" id="check">Проверить</button></div>';ans.focus();function go(){if(!ans.value.trim())return;let ok=norm(ans.value)===norm(correct)||norm(correct).split(',').map(norm).includes(norm(ans.value));reg(ok);answer.innerHTML=`<div class="${ok?'':'notice'}"><b>${ok?'Верно ✓':'Неверно ✕'}</b>${ok?'':`<div>Ответ: ${esc(correct)}</div>`}</div><div class="actions" style="justify-content:center"><button class="btn" id="next">Дальше</button></div>`;next.onclick=()=>{sess.i++;showQ()}}check.onclick=go;ans.onkeydown=e=>{if(e.key==='Enter')go()}}
function choiceQ(w){let others=shuffle(state.words.filter(x=>x.id!==w.id)).slice(0,3).map(x=>x.translation),opts=shuffle([w.translation,...others]);answer.innerHTML='<div class="choices">'+opts.map(o=>`<button class="choice" data-v="${esc(o)}">${esc(o)}</button>`).join('')+'</div>';answer.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{let ok=norm(b.dataset.v)===norm(w.translation);reg(ok);answer.querySelectorAll('.choice').forEach(x=>x.disabled=true);answer.insertAdjacentHTML('beforeend','<div class="actions" style="justify-content:center"><button class="btn" id="next">Дальше</button></div>');next.onclick=()=>{sess.i++;showQ()}})}
function flashQ(w){answer.innerHTML='<button class="btn alt" id="reveal">Показать перевод</button>';reveal.onclick=()=>{answer.innerHTML=`<div style="font-size:24px;font-weight:900">${esc(w.translation)}</div><div class="actions" style="justify-content:center"><button class="btn bad" id="no">Не помню</button><button class="btn good" id="yes">Знаю</button></div>`;no.onclick=()=>{reg(false);sess.i++;showQ()};yes.onclick=()=>{reg(true);sess.i++;showQ()}}}
function reg(ok){let w=cw();sess.total++;w.seen=(w.seen||0)+1;if(ok){sess.correct++;w.correct=(w.correct||0)+1;w.level=Math.min(6,(w.level||0)+1);let days=[0,1,2,4,7,14,30][w.level]||30;w.nextReview=Date.now()+days*86400000}else{w.wrong=(w.wrong||0)+1;w.level=Math.max(0,(w.level||0)-2);w.nextReview=Date.now()+10*60000}localStorage.setItem(KEY,JSON.stringify(state));live.textContent=`верно ${sess.correct}`}
function finish(){state.stats.sessions++;state.stats.correct+=sess.correct;state.stats.total+=sess.total;let t=today(),d=state.stats.daily[t]||{sessions:0,correct:0,total:0};d.sessions++;d.correct+=sess.correct;d.total+=sess.total;state.stats.daily[t]=d;if(state.stats.lastDate!==t){let y=new Date(Date.now()-86400000).toISOString().slice(0,10);state.stats.streak=state.stats.lastDate===y?(state.stats.streak||0)+1:1;state.stats.lastDate=t}save();session.classList.add('hide');result.classList.remove('hide');let p=Math.round(sess.correct/Math.max(1,sess.total)*100);score.textContent=p+'%';scoreText.textContent=`${sess.correct} из ${sess.total} правильных. Сложные слова будут повторяться чаще.`}
again.onclick=()=>{result.classList.add('hide');setup.classList.remove('hide')};homeBtn.onclick=()=>{result.classList.add('hide');setup.classList.remove('hide');goto('home')};
speak.onclick=()=>{let w=cw();if(!w||!speechSynthesis)return;let u=new SpeechSynthesisUtterance(w.word);u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)};
exportBtn.onclick=()=>{let a=document.createElement('a'),blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='slovotrener-backup.json';a.click();URL.revokeObjectURL(a.href)};
importFile.onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.words))throw 0;state=d;state.stats ||= empty().stats;save();alert('Импортировано')}catch{alert('Не удалось импортировать')}};
resetBtn.onclick=()=>{if(confirm('Удалить личный прогресс и свои слова?')){localStorage.removeItem(KEY);state=load();save()}};
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
render();
</script>
</body></html>
